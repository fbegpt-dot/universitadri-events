name: Aggiorna e pubblica scadenzario

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "style.css"
      - "sources.json"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/update-events.yml"
  schedule:
    - cron: "15 7 * * 1"
      timezone: "Europe/Rome"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Controlla Open Day e orientamento
        id: scrape
        run: python scripts/update_events.py

      - name: Costruisci lo scadenzario
        id: build
        run: python scripts/build_scadenzario.py

      - name: Salva eventuali aggiornamenti dei dati
        id: commit_data
        run: |
          git config user.name "universitadri-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/source_status.json data/scadenzario.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento dei dati."
          else
            git commit -m "Aggiorna scadenzario università"
            git push
          fi

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html style.css sources.json _site/
          cp data/scadenzario.json _site/data/scadenzario.json

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registra esito finale e novità
        if: always()
        env:
          SCRAPE: ${{ steps.scrape.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DATA_COMMIT: ${{ steps.commit_data.outcome }}
          DEPLOY: ${{ steps.deployment.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/monitor_report.py --scrape "$SCRAPE" --build "$BUILD" --commit "$DATA_COMMIT" --deploy "$DEPLOY" --run-url "$RUN_URL"
          git config user.name "universitadri-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/monitor_report.json
          git commit -m "Registra esito controllo settimanale" || echo "Nessuna modifica al rapporto."
          git push

