name: Aggiorna upcoming events

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"
      timezone: "Europe/Rome"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Controlla le fonti
        run: python scripts/update_events.py

      - name: Salva eventuali aggiornamenti
        run: |
          git config user.name "universitadri-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento."
          else
            git commit -m "Aggiorna upcoming events"
            git push
          fi
