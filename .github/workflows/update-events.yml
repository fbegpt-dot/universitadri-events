name: Aggiorna e pubblica upcoming events

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "style.css"
      - "sources.json"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/update-events.yml"
  schedule:
    - cron: "15 7 * * 1"
      timezone: "Europe/Rome"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Controlla le fonti
        run: python scripts/update_events.py

      - name: Salva eventuali aggiornamenti dei dati
        run: |
          git config user.name "universitadri-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento dei dati."
          else
            git commit -m "Aggiorna upcoming events"
            git push
          fi

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html style.css sources.json _site/
          cp data/events.json _site/data/events.json

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
